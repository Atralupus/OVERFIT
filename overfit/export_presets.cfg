; 익스포트 프리셋. **커밋한다** — 이게 없으면 다른 기계에서 익스포트가 아예 안 된다.
; Godot 에디터가 이 파일을 다시 쓰면 이 주석은 사라진다. 사라지면 다시 적어라.
;
; 적어 두는 것은 값이 아니라 이유다:
;   codesign/codesign=1 은 Developer ID 서명이 아니라 **내장 ad-hoc** 이다. 공증(notarization)은 껐다.
;   애플 실리콘은 서명이 아예 없는 arm64 바이너리를 실행 시점에 죽인다 — 로컬 빌드를 돌려 보려면
;   ad-hoc 서명이 필요하다. "서명 안 한 빌드" 가 뜻하는 것은 배포용 인증서를 안 쓴다는 것이지
;   서명 블록이 없는 바이너리가 아니다.
;
;   export_filter="all_resources" 다. 지금 게임이 쓰는 스프라이트는 넷뿐이고 팩에는 697장이 들어 있어
;   빌드가 그만큼 커진다. 그래도 거르지 않는 이유는 어느 스프라이트를 쓰는지가 **데이터**에 있어서다
;   (fighters.json · bosses.json 의 sprite). 필터로 걸러 두면 데이터를 고친 순간 그림이 조용히 빠지고,
;   없는 스프라이트는 [W] 한 줄이라 실행은 그대로 된다 — 딱 알아채기 어려운 종류의 깨짐이다.

